# =====================================================================================
# Configuración de PRODUCCIÓN. Se activa con la variable de entorno SPRING_PROFILES_ACTIVE=prod
# y solo reemplaza lo que cambia respecto a application.properties.
#
# Los secretos NO tienen valor por defecto: si falta una variable obligatoria la aplicación no
# arranca ("Could not resolve placeholder ..."), en lugar de arrancar con los valores de desarrollo.
#
# Variables obligatorias:
#   DB_URL                 jdbc:postgresql://<host>:5432/<base>
#   DB_USERNAME            usuario de PostgreSQL de la aplicación (no el superusuario)
#   DB_PASSWORD            contraseña de ese usuario
#   JWT_SECRET             clave en Base64 de al menos 32 bytes, distinta a la de desarrollo
#                          (generarla con: openssl rand -base64 32)
#   CORS_ALLOWED_ORIGINS   dirección del frontend, por ejemplo https://veterinaria.ejemplo.com
#                          (varias separadas por comas)
# Variables opcionales:
#   PORT (8080), JWT_EXPIRATION_MINUTES (480), DB_POOL_SIZE (10)
# =====================================================================================

server.port=${PORT:8080}

# --- Base de datos: sin valores por defecto ---
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:10}

# --- JWT: sin valor por defecto (la clave de desarrollo está en el repositorio) ---
jwt.secret=${JWT_SECRET}
jwt.expiration-minutes=${JWT_EXPIRATION_MINUTES:480}

# --- CORS: solo el dominio real del frontend ---
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS}

# --- Usuario de demostración (demo / demo123, rol ADMIN): apagado en producción ---
app.demo-login.enabled=false

# --- Documentación de la API: apagada (Swagger expone la lista completa de endpoints) ---
springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false

# --- Errores: nunca enviar detalles internos al cliente (RNF-05) ---
server.error.include-message=never
server.error.include-stacktrace=never
server.error.include-binding-errors=never
server.error.include-exception=false

# --- Detrás de un proxy o balanceador con HTTPS (Nginx, Render, Railway, etc.) ---
server.forward-headers-strategy=framework

# --- Registro: sin mensajes de depuración ---
logging.level.root=INFO
logging.level.com.example.proyectoIntegrador=INFO
