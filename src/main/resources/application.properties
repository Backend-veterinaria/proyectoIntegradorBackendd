spring.application.name=proyectoIntegrador
server.port=8080
# --- Base de datos ---
# Cada persona puede usar su propia base sin modificar este archivo, con las variables de entorno
# DB_URL, DB_USERNAME y DB_PASSWORD (por ejemplo DB_URL=jdbc:postgresql://localhost:5432/postgres).
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/VETERINARIAPP}
spring.datasource.username=${DB_USERNAME:admin}
spring.datasource.password=${DB_PASSWORD:admin123}
spring.datasource.driver-class-name=org.postgresql.Driver

# --- JWT ---
# Clave HMAC-SHA256 en Base64 (mínimo 32 bytes). En despliegue se debe definir la variable de
# entorno JWT_SECRET con otra clave; el valor por defecto es solo para desarrollo local.
# Generar una nueva: openssl rand -base64 32
jwt.secret=${JWT_SECRET:MisoecjvfK6i/cabmsqbXsZomFYAcZgYWm+DdON7Ekw=}
# Duración del token en minutos (480 = 8 horas, una jornada de trabajo)
jwt.expiration-minutes=${JWT_EXPIRATION_MINUTES:480}

# --- CORS ---
# Orígenes del frontend separados por comas (5173 es el puerto por defecto de Vite)
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}

# --- Documentación de la API (QA-05) ---
# Swagger UI: http://localhost:8080/swagger-ui.html  |  OpenAPI: http://localhost:8080/v3/api-docs
# Para apagarla (por ejemplo en producción): API_DOCS_ENABLED=false
springdoc.api-docs.enabled=${API_DOCS_ENABLED:true}
springdoc.swagger-ui.enabled=${API_DOCS_ENABLED:true}
springdoc.swagger-ui.operations-sorter=alpha
springdoc.swagger-ui.tags-sorter=alpha
springdoc.swagger-ui.persist-authorization=true
